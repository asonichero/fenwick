<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Squire of Redmere</title>
<style>
:root { --panel: rgba(26, 20, 16, 0.88); --line: #4e4034; --ink: #efe4d0; --dim: #ab9c88; --amber: #d8a24a; --teal: #9cc28a; --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif; }
html, body { margin: 0; height: 100%; background: #05070a; color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
#view { position: fixed; inset: 0; }
button { font: inherit; color: var(--ink); background: #2e2620; border: 1px solid var(--line); border-radius: 12px; padding: 7px 14px; cursor: pointer; }
button:hover { border-color: var(--amber); } button:disabled { opacity: 0.45; cursor: default; border-color: var(--line); }
a { color: var(--amber); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; backdrop-filter: blur(6px); }
/* black over the scene: the title, the cards told before it, the cut at its end */
#black { position: fixed; inset: 0; background: #05070a; z-index: 5; opacity: 1; transition: opacity 1.4s ease; pointer-events: none; }
#black.off { opacity: 0; } #black.dim { opacity: 0.7; } #black.quick { transition: opacity 0.6s ease; }      /* (dim: the opening shot, still, behind the title and the cards) */
#title, #card, #end { position: fixed; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
#title h1 { font: 400 clamp(34px, 7vw, 64px)/1.05 var(--serif); letter-spacing: 0.06em; margin: 0 0 34px; color: #f3e6cc; }
#begin { font: 400 17px var(--serif); padding: 10px 26px; border-radius: 22px; }
#title .note { margin-top: 14px; font-size: 12px; color: var(--dim); min-height: 1.4em; }
#title .more { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom)); font-size: 12px; color: var(--dim); } #title .more a { margin: 0 6px; }
#card { display: none; cursor: pointer; max-width: 680px; margin: 0 auto; } #card.on { display: flex; }
#card .big { font: 400 clamp(30px, 6vw, 52px)/1.1 var(--serif); letter-spacing: 0.08em; color: #f3e6cc; }
#card .small { font: italic 400 17px/1.4 var(--serif); color: var(--dim); margin-top: 10px; }
#card .text { font: 400 clamp(17px, 2.6vw, 22px)/1.55 var(--serif); color: #e8dcc4; }
#card > * { opacity: 0; transition: opacity 0.9s ease; } #card.shown > * { opacity: 1; }
/* the player's name, asked on the second card */
#card.ask { cursor: default; } #card.ask .hint { display: none; }
#card form { margin-top: 28px; display: none; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: flex-end; } #card.ask form { display: flex; }
#card label { display: flex; flex-direction: column; gap: 5px; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); text-align: left; }
#card input { font: 400 20px var(--serif); color: var(--ink); background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; width: 190px; box-sizing: border-box; }
#card input:focus { outline: none; border-color: var(--amber); }
#card form button { font: 400 17px var(--serif); padding: 9px 22px; border-radius: 22px; }
@media (max-width: 480px) { #card input { width: calc(50vw - 30px); font-size: 17px; } }
.hint { margin-top: 26px; font-size: 12px; color: var(--amber); opacity: 0; transition: opacity 0.6s ease 0.8s; } #card.shown .hint { opacity: 0.8; }
#end { display: none; } #end.on { display: flex; }
#end .k { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--amber); }
#end h2 { font: 400 clamp(26px, 5vw, 40px)/1.15 var(--serif); margin: 10px 0 4px; color: #f3e6cc; } #end p { font: italic 16px var(--serif); color: var(--dim); margin: 0 0 24px; }
#end .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
/* the dialogue, at the foot of the screen: the speaker's name on a tab, the line typing out */
#dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom)); width: min(780px, calc(100% - 24px)); z-index: 4; }
#say { position: relative; box-sizing: border-box; padding: 16px 20px 14px; display: none; min-height: 78px; }
body.film #view { cursor: pointer; }
#say .who { position: absolute; top: -12px; left: 18px; background: #3a2e24; border: 1px solid var(--line); border-radius: 10px; padding: 1px 10px; font-size: 12px; color: var(--amber); letter-spacing: 0.02em; }
#say .who.silas { color: var(--teal); }
#say .txt { font: 18px/1.45 var(--serif); }
/* a choice: what Silas says, one button each, numbered */
#say .choices { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; } #say .choices:empty { display: none; }
#say .choices button { text-align: left; display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; border-radius: 12px; font: 16px/1.35 var(--serif); }
#say .choices .n { font: 11px ui-monospace, monospace; color: var(--amber); min-width: 10px; } #say .choices b { font: 600 12px system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--teal); min-width: 54px; }
#say .hintc { font-size: 12px; color: var(--dim); margin-top: 8px; } #say .hintc:empty { display: none; }
#say .next { display: none; position: absolute; right: 14px; bottom: 8px; font-size: 13px; color: var(--amber); animation: nudge 1.1s ease-in-out infinite; pointer-events: none; }
@keyframes nudge { 0%, 100% { opacity: 0.35; transform: translateX(0); } 50% { opacity: 1; transform: translateX(3px); } }
#skip { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); z-index: 7; display: none; font-size: 13px; padding: 5px 12px; background: rgba(26, 20, 16, 0.7); }
/* letterbox bars while the scene plays */
.bar { position: fixed; left: 0; right: 0; height: 0; background: #05070a; z-index: 3; transition: height 1.2s ease; } #barT { top: 0; } #barB { bottom: 0; }
body.film .bar { height: 6vh; }
kbd { font: 11px ui-monospace, monospace; color: var(--dim); }
@media (max-width: 760px) { #say { padding: 13px 15px 11px; } #say .txt { font-size: 15px; } body.film .bar { height: 3vh; } }
@media (hover: none) { kbd { display: none; } }
</style>
</head>
<body>
<div id="view"></div>
<div class="bar" id="barT"></div><div class="bar" id="barB"></div>
<div id="black"></div>
<div id="title">
  <h1>The Squire of Redmere</h1>
  <button id="begin" disabled>Begin</button>
  <div class="note" id="loading">Lighting the hall…</div>
  <div class="more"><a href="session.html">The correction (test)</a>·<a href="rooms.html">Rooms</a>·<a href="figures.html">Figures</a>·<a href="household.html?set=prologue">The prologue’s cast</a></div>
</div>
<div id="card"><div class="big"></div><div class="small"></div><div class="text"></div>
  <form id="nameForm" autocomplete="off"><label>First name<input id="first" maxlength="24" spellcheck="false"></label><label>Surname<input id="last" maxlength="24" spellcheck="false"></label><button type="submit">Go on</button></form>
  <div class="hint">Click anywhere to go on <kbd>space</kbd></div></div>
<div id="end"><div class="k">Next</div><h2 id="endT"></h2><p id="endW"></p><div class="row"><button id="again">Play the scene again</button><button id="toTitle">To the title</button></div></div>
<div id="dock"><div id="say" class="panel"><div class="who" id="sayWho"></div><div class="txt" id="sayTxt"></div><div class="choices" id="choices"></div><div class="hintc" id="chooseHint"></div><div class="next" id="sayNext">▸</div></div></div>
<button id="skip">Skip scene <kbd>esc</kbd></button>

<script src="vendor/three.min.js"></script><script src="vendor/OrbitControls.js"></script><script src="vendor/postprocessing.js"></script><script src="vendor/GLTFLoader.js"></script>
<script src="js/cast.js"></script><script src="js/figure.js"></script><script src="js/poses.js"></script><script src="js/stage.js"></script><script src="js/kit.js"></script><script src="js/hall.js"></script><script src="js/office.js"></script>
<script src="js/audio.js"></script><script src="js/player.js"></script><script src="js/prologue.js"></script><script src="js/cutscene.js"></script>
<script>
'use strict';
// The game: the title, then the prologue's scenes in order (js/prologue.js: the hall, then his office), each played by js/cutscene.js in its
// room. The player's name is asked on the second card and kept (js/player.js); the scenes call them by it. The one choice (how he answers
// Cicely's plea) is kept too, for her correction.
// ?scene=office: begin there · ?at=N: straight into the scene at beat N, the line shown whole and held (for checking a shot) · ?still=1: the
// picture kept for capture · ?low=1
const $ = id => document.getElementById(id), q = new URLSearchParams(location.search), V3 = THREE.Vector3;
const stage = Stage.create($('view'), { keep: !!q.get('still'), low: !!q.get('low') }), scene = stage.scene, camera = stage.camera;
stage.controls.enabled = false;            // (the camera's the scene's)
camera.far = 120; camera.updateProjectionMatrix();
// (a little warm light from where the camera stands, as a film's fill, so faces read in rooms lit by candles and fires; set a little behind
// the camera, so what's close to it isn't washed out)
const fillL = new THREE.PointLight(0xffe0bc, 1.3, 5, 2); fillL.position.set(0, 0.25, 0.9); camera.add(fillL); scene.add(camera);
// (the rooms, both built, one shown at a time)
const ROOMS = { hall: Hall.build(scene), office: Office.build(scene) }; for (const k in ROOMS) ROOMS[k].showMarks(false);
const SCENES = Prologue.SCENES, ORDER = Prologue.ORDER, first = SCENES[q.get('scene')] ? q.get('scene') : ORDER[0];
let room = ROOMS.hall, SC = SCENES.hall;
const showRoom = k => { for (const j in ROOMS) ROOMS[j].group.visible = j === k; room = ROOMS[k]; };
showRoom('hall');
const at0 = q.get('at') != null ? Math.max(0, +q.get('at') || 0) : null, still = at0 != null;
// (the prologue's choices, kept)
const KEEP = 'fenwick:prologue';
const kept = () => { try { return JSON.parse(localStorage.getItem(KEEP) || '{}') || {}; } catch (e) { return {}; } };
const keep = (k, v) => { try { const o = kept(); o[k] = v; localStorage.setItem(KEEP, JSON.stringify(o)); } catch (e) { /* not kept */ } };

// ── The cast: everyone any scene lists, made once ──
let cast = null, cs = null;
const specOf = s => s[0] === 'man' ? Cast.manSpec(s[1]) : s[0] === 'silas' ? Cast.squireSpec() : Cast.figureSpec(s[1], 'f', s[2]);
const castOf = S => { const o = {}; for (const id in cast) { if (S.cast[id]) o[id] = cast[id]; else cast[id].root.visible = false; } return o; };
const ready = Figure.preload().then(() => {
  cast = {}; for (const k of ORDER) for (const id in SCENES[k].cast) if (!cast[id]) { const f = Figure.make(specOf(SCENES[k].cast[id].spec)); scene.add(f.root); cast[id] = f; }
  // (everyone in their places from the first, behind the title: never left standing where they were made, in the table)
  cs = Cutscene.create({ stage, room, scene: SC, cast: castOf(SC), ui, fill: Player.fill });
  if (!still) opening(); else cs.place();
  $('begin').disabled = false; $('loading').textContent = '';
});
// (the opening shot, before it moves: everyone in their places, a moment for the skirts to hang, then held still, and dimmed, behind the title)
async function opening() {
  stage.hold(false); showRoom('hall'); SC = SCENES.hall; cs = Cutscene.create({ stage, room, scene: SC, cast: castOf(SC), ui, fill: Player.fill }); cs.place();
  const v = Prologue.shot(SC, 'foot', cs.spots); stage.go(new V3(...v.cam), new V3(...v.look), 0);
  await new Promise(r => setTimeout(r, 1400)); if (playing) return; stage.hold(true); shade('dim');
}

// ── The dialogue box: the line types out in the speaker's voice; a click (or space) shows it whole, then goes on ──
let advance = null, typer = null, picking = null;
function line({ id, name, text, ms }) {
  return new Promise(res => {
    const box = $('say'), el = $('sayTxt'); box.style.display = 'block'; $('sayWho').textContent = name; $('sayWho').className = 'who' + (id === 'silas' ? ' silas' : ''); $('sayNext').style.display = 'none';
    if (window.GameAudio && GameAudio.ctx) GameAudio.speak(id, text, Math.min(3.2, text.length * 0.035), { pitch: Cast.pitch(id) });
    let i = 0; clearInterval(typer); el.textContent = ''; $('choices').innerHTML = ''; $('chooseHint').textContent = ''; picking = null;
    const whole = () => { clearInterval(typer); el.textContent = text; $('sayNext').style.display = 'block'; advance = () => { advance = null; $('sayNext').style.display = 'none'; res(); }; };
    if (still) { whole(); advance = null; return; }
    advance = whole; typer = setInterval(() => { el.textContent = text.slice(0, ++i); if (i >= text.length) whole(); }, Cutscene.TYPE_MS);
  });
}
// (a choice: what Silas says, as buttons under the prompt; a click, or its number)
function choose({ name, prompt, hint, options }) {
  return new Promise(res => {
    const box = $('say'); box.style.display = 'block'; $('sayWho').textContent = name; $('sayWho').className = 'who silas'; $('sayNext').style.display = 'none';
    clearInterval(typer); $('sayTxt').textContent = prompt; advance = null;
    const el = $('choices'); el.innerHTML = ''; $('chooseHint').textContent = hint || '';
    const pick = id => { picking = null; el.innerHTML = ''; $('chooseHint').textContent = ''; res(id); };
    options.forEach((o, i) => { const b = document.createElement('button'), k = document.createElement('span'), l = document.createElement('b'), t = document.createElement('span');
      k.className = 'n'; k.textContent = i + 1; l.textContent = o.label; t.textContent = '“' + o.text + '”'; b.append(k, l, t); b.onclick = () => pick(o.id); el.append(b); });
    picking = options.map(o => () => pick(o.id)); window.__choose = picking;
  });
}
const hideLine = () => { $('say').style.display = 'none'; $('choices').innerHTML = ''; $('chooseHint').textContent = ''; };
// (over the picture: black, dim (the still behind the title and the cards), or clear)
function shade(level, quick) { const b = $('black'); b.classList.toggle('quick', !!quick); b.classList.toggle('dim', level === 'dim'); b.classList.toggle('off', level === 'clear'); return new Promise(r => setTimeout(r, level === 'clear' ? 300 : quick ? 650 : 1450)); }
const black = (on, quick) => shade(on ? 'black' : 'clear', quick);
const ui = { line, choose, chose: keep, fade: async on => { hideLine(); await black(on, true); }, names() {}, pause: ms => new Promise(r => { if (!still) setTimeout(r, ms); }) };      // (?at: held on it)

// ── The cards, told over the still before the first scene ──
function card(c) {
  return new Promise(res => {
    const el = $('card'); el.querySelector('.big').textContent = c.big || ''; el.querySelector('.small').textContent = c.small || ''; el.querySelector('.text').textContent = Player.fill(c.text || '');
    el.classList.toggle('ask', c.ask === 'name'); el.classList.add('on'); el.classList.remove('shown'); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('shown')));
    const t0 = performance.now(), go = () => { advance = null; $('nameForm').onsubmit = null; el.classList.remove('shown'); setTimeout(() => { el.classList.remove('on', 'ask'); res(); }, 650); };
    if (c.ask === 'name') {
      // (their name: as they last gave it, Silas Fenwick at first; on only by Go on, or Enter)
      const n = Player.get(); $('first').value = n.first; $('last').value = n.last; advance = null;
      setTimeout(() => { try { $('first').focus(); $('first').select(); } catch (e) {} }, 700);
      $('nameForm').onsubmit = e => { e.preventDefault(); Player.set({ first: $('first').value, last: $('last').value }); go(); };
    } else advance = () => { if (performance.now() - t0 < 500) return; go(); };
  });
}

// ── Playing it: from a scene (the first, unless asked), each in turn, to the end; a scene skipped goes on to the next ──
let playing = false, runId = 0;
async function run(from, cards, start) {
  const my = ++runId; start = SCENES[start] ? start : first;
  $('end').classList.remove('on'); $('title').style.display = 'none';
  if (cards) { for (const c of SCENES[ORDER[0]].cards) await card(c); }      // (over the opening shot, held still and dimmed)
  if (my !== runId) return;
  playing = true; $('skip').style.display = still ? 'none' : 'block'; document.body.classList.add('film');
  for (let i = ORDER.indexOf(start), f = from || 0; i < ORDER.length; i++, f = 0) {
    if (cs) cs.stop();
    stage.hold(false); SC = SCENES[ORDER[i]]; showRoom(SC.room);
    cs = Cutscene.create({ stage, room, scene: SC, cast: castOf(SC), ui, fill: Player.fill, chosen: kept() }); window.cs = cs;
    const done = cs.play(f);
    black(false);
    await done;
    if (my !== runId || still) return;
    hideLine(); await black(true, true);      // (between scenes, black; a scene skipped is cut to it)
  }
  playing = false; $('skip').style.display = 'none'; document.body.classList.remove('film');
  finish();
}
async function finish() {
  await black(true, true); hideLine();
  $('endT').textContent = SC.next.title; $('endW').textContent = SC.next.where; $('end').classList.add('on');
}
function skip() { if (!playing || !cs) return; cs.stop(); if (picking) picking[0](); if (advance) advance(); if (advance) advance(); }
function audioOn() { if (window.GameAudio && GameAudio.init()) GameAudio.hearth({ fire: 0.85, wind: 0.25 }); }

$('begin').onclick = () => { audioOn(); ready.then(() => run(0, true, ORDER[0])); };
$('again').onclick = () => run(0, false, ORDER[0]);
$('toTitle').onclick = () => { $('end').classList.remove('on'); $('title').style.display = 'flex'; opening(); };
$('skip').onclick = skip;
// (a click anywhere goes on, but on a button or a link)
addEventListener('click', e => { if (e.target.closest('button, a, input, label, form')) return; if (advance) advance(); });
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, textarea')) return;      // (typing a name)
  if (picking && /^[1-9]$/.test(e.key) && picking[+e.key - 1]) { picking[+e.key - 1](); e.preventDefault(); return; }
  if (e.key === ' ' || e.key === 'Enter') { if (advance) { advance(); e.preventDefault(); } }
  else if (e.key === 'Escape') skip();
});

// ── Each frame: the walls between the camera and the scene out of the way, the fire, the people ──
stage.start(dt => {
  const s = room.sidesAt(camera.position); s.add('C');
  for (const [o, side] of room.sideOf) o.visible = !s.has(side);
  room.tick(dt); if (cs) cs.tick(dt);
});
if (still) ready.then(() => { $('title').style.display = 'none'; run(at0, false, first).catch(e => console.error(e)); setTimeout(() => { window.ready = true; }, 2500); });
else ready.then(() => { window.ready = true; });
window.__game = { stage, rooms: ROOMS, get room() { return room; }, get scene() { return SC; }, get cs() { return cs; }, get cast() { return cast; }, run: (from, cards, start) => run(from, cards, start || first) };
</script>
</body>
</html>
